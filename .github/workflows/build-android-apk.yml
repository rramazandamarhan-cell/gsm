name: Build Android APK & Play Store AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (required by Capacitor 7 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web app for Debug Test APK (Google AdMob Test Ads)
        env:
          VITE_ADMOB_TESTING: 'true'
        run: npm run build

      - name: Install Capacitor CLI & Android platform
        run: npm install --legacy-peer-deps @capacitor/cli@7 @capacitor/android@7

      - name: Add Android native project & sync web assets
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "=== Verifying AdMob native plugin linking ==="
          grep -i "admob" android/capacitor.settings.gradle
          grep -i "AdMob" android/app/src/main/assets/capacitor.plugins.json

      - name: Configure Landscape Fullscreen, Store Icons & Version Stamping
        run: |
          python3 - << 'PYEOF'
          import glob, os, re
          import xml.etree.ElementTree as ET

          # 1. Patch AndroidManifest.xml for sensorLandscape, network & AD_ID permissions, game category & Google AdMob App ID
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              txt = open(manifest_path, encoding="utf-8").read()
              extra_perms = [
                  '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>',
                  '<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>',
              ]
              for perm in extra_perms:
                  perm_name = perm.split('android:name="')[1].split('"')[0]
                  if perm_name not in txt and '<application' in txt:
                      txt = txt.replace('<application', f'{perm}\n    <application', 1)
              if 'android:appCategory' not in txt and '<application' in txt:
                  txt = txt.replace('<application', '<application android:appCategory="game"', 1)
              if 'android:screenOrientation' not in txt:
                  txt = txt.replace('<activity', '<activity android:screenOrientation="sensorLandscape"', 1)
              admob_meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-9402241323787415~3281325258"/>'
              if 'com.google.android.gms.ads.APPLICATION_ID' not in txt and '</application>' in txt:
                  txt = txt.replace('</application>', f'    {admob_meta}\n    </application>', 1)
              open(manifest_path, "w", encoding="utf-8").write(txt)
              ET.parse(manifest_path)
              print("Configured AndroidManifest.xml ACCESS_NETWORK_STATE + AD_ID + game category + sensorLandscape + AdMob App ID OK")

          # 2. Patch res/values/styles.xml for dark edge-to-edge fullscreen & notch cutout coverage
          styles_path = "android/app/src/main/res/values/styles.xml"
          if os.path.exists(styles_path):
              ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
              tree = ET.parse(styles_path)
              root = tree.getroot()
              fullscreen_items = {
                  "android:windowFullscreen": "true",
                  "android:windowBackground": "#0F141B",
                  "android:colorBackground": "#0F141B",
                  "android:statusBarColor": "@android:color/transparent",
                  "android:navigationBarColor": "@android:color/transparent",
                  "android:windowDrawsSystemBarBackgrounds": "true",
                  "android:windowLayoutInDisplayCutoutMode": "shortEdges",
                  "android:enforceNavigationBarContrast": "false",
                  "android:enforceStatusBarContrast": "false",
              }
              for style_el in root.findall("style"):
                  sname = style_el.get("name", "")
                  if sname in ("AppTheme", "AppTheme.NoActionBar", "AppTheme.NoActionBarLaunch"):
                      existing = {item.get("name"): item for item in style_el.findall("item")}
                      if sname == "AppTheme.NoActionBarLaunch" and "android:background" in existing:
                          existing["android:background"].text = "#0F141B"
                      for k, v in fullscreen_items.items():
                          if k in existing:
                              existing[k].text = v
                          else:
                              el = ET.SubElement(style_el, "item", {"name": k})
                              el.text = v
              tree.write(styles_path, encoding="utf-8", xml_declaration=True)
              ET.parse(styles_path)
              print("Patched styles.xml for dark edge-to-edge fullscreen OK")

          # 3. Patch MainActivity.java for Android Sticky Immersive Fullscreen (hides status & nav bars)
          main_activities = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)
          if main_activities:
              ma_path = main_activities[0]
              orig = open(ma_path, encoding="utf-8").read()
              pkg_match = re.search(r'^\s*package\s+([^;]+);', orig, re.MULTILINE)
              pkg_name = pkg_match.group(1).strip() if pkg_match else "com.esnafgsm.simulator"
              java_code = f'''package {pkg_name};

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {{
              @Override
              public void onCreate(Bundle savedInstanceState) {{
                  super.onCreate(savedInstanceState);
                  applyImmersiveFullscreen();
              }}

              @Override
              public void onResume() {{
                  super.onResume();
                  applyImmersiveFullscreen();
              }}

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {{
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {{
                      applyImmersiveFullscreen();
                  }}
              }}

              @SuppressWarnings("deprecation")
              private void applyImmersiveFullscreen() {{
                  Window window = getWindow();
                  if (window == null) return;

                  int darkBg = Color.parseColor("#0F141B");
                  View decorView = window.getDecorView();
                  decorView.setBackgroundColor(darkBg);
                  window.setStatusBarColor(Color.TRANSPARENT);
                  window.setNavigationBarColor(Color.TRANSPARENT);
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  if (getBridge() != null && getBridge().getWebView() != null) {{
                      getBridge().getWebView().setBackgroundColor(darkBg);
                  }}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {{
                      WindowManager.LayoutParams lp = window.getAttributes();
                      lp.layoutInDisplayCutoutMode =
                          Build.VERSION.SDK_INT >= Build.VERSION_CODES.R
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      window.setAttributes(lp);
                  }}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {{
                      window.setNavigationBarContrastEnforced(false);
                      window.setStatusBarContrastEnforced(false);
                  }}

                  WindowCompat.setDecorFitsSystemWindows(window, false);
                  WindowInsetsControllerCompat controller = WindowCompat.getInsetsController(window, decorView);
                  if (controller != null) {{
                      controller.setSystemBarsBehavior(
                          WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      );
                      controller.hide(WindowInsetsCompat.Type.systemBars());
                  }}

                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) {{
                      decorView.setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                              | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                              | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                              | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                              | View.SYSTEM_UI_FLAG_FULLSCREEN
                      );
                  }}
              }}
          }}
          '''
              open(ma_path, "w", encoding="utf-8").write(java_code.strip() + "\n")
              print(f"Patched {ma_path} for Sticky Immersive Fullscreen OK")
          PYEOF

          # Stamp semantic versionName, auto-incrementing versionCode, and minSdkVersion >= 24 (Google Play Automatic Protection)
          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            VERSION_CODE="${{ github.run_number }}"
            sed -i "s/versionCode [0-9]\+/versionCode ${VERSION_CODE}/" "$GRADLE_FILE"
            sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' "$GRADLE_FILE"
            echo "Stamped versionCode=${VERSION_CODE} versionName=1.0.0"
          fi

          VARS_FILE="android/variables.gradle"
          if [ -f "$VARS_FILE" ]; then
            sed -i "s/minSdkVersion = [0-9]\+/minSdkVersion = 24/" "$VARS_FILE"
            sed -i "s/compileSdkVersion = [0-9]\+/compileSdkVersion = 36/" "$VARS_FILE"
            sed -i "s/targetSdkVersion = [0-9]\+/targetSdkVersion = 36/" "$VARS_FILE"
            echo "Set minSdk=24, compileSdk=36, targetSdk=36 in android/variables.gradle"
          fi

          # Ensure AGP compiles cleanly against Android 16 (API 36)
          GRADLE_PROPS="android/gradle.properties"
          if [ -f "$GRADLE_PROPS" ] && ! grep -q "android.suppressUnsupportedCompileSdk" "$GRADLE_PROPS"; then
            echo "android.suppressUnsupportedCompileSdk=36" >> "$GRADLE_PROPS"
          fi

          # Copy custom GSM Simulator 512px icon into Android mipmap launcher resources
          if [ -f "public/pwa-512x512.png" ]; then
            FG_ICON="public/pwa-maskable-512x512.png"
            if [ ! -f "$FG_ICON" ]; then
              FG_ICON="public/pwa-512x512.png"
            fi
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              DIR="android/app/src/main/res/mipmap-${density}"
              mkdir -p "$DIR"
              cp public/pwa-512x512.png "$DIR/ic_launcher.png"
              cp public/pwa-512x512.png "$DIR/ic_launcher_round.png"
              cp "$FG_ICON" "$DIR/ic_launcher_foreground.png"
            done
            echo "Copied custom GSM Simulator launcher icons"
          fi

      - name: Ensure Android SDK Platform 36 is installed
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ] && [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" || true
          fi

      - name: Compile Debug APK (Instant Phone Testing)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GSM-Simulator-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Check Play Store Signing Keystore
        id: signing_check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild Production Web Assets for Play Store AAB (Live AdMob Ads)
        if: steps.signing_check.outputs.has_keystore == 'true'
        env:
          VITE_ADMOB_TESTING: 'false'
        run: |
          npm run build
          npx cap sync android
          grep -i "AdMob" android/app/src/main/assets/capacitor.plugins.json

      - name: Build Signed Google Play Release AAB (when Keystore Secrets are configured)
        if: steps.signing_check.outputs.has_keystore == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > app/release-keystore.jks
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$(pwd)/app/release-keystore.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f app/release-keystore.jks

      - name: Upload Signed Play Store AAB Artifact
        if: steps.signing_check.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GSM-Simulator-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
